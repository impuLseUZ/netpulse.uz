name: Release

# Запускается когда пушишь тег вида v1.2.3
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & Publish
        # GH_TOKEN нужен electron-builder чтобы загрузить артефакты в GitHub Releases.
        # Токен создаётся автоматически GitHub Actions — ничего настраивать не нужно.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish:win