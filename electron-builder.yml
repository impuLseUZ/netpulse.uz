appId: com.netpulse.app
productName: NetPulse
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - resources/**/*
  - package.json
  - node_modules/ssh2/**/*
  - node_modules/cpu-features/**/*
asarUnpack:
  - resources/**
  - node_modules/ssh2/**/*
  - node_modules/cpu-features/**/*

# Фид автообновления — GitHub Releases репозитория impuLseUZ/netpulse.uz
publish:
  provider: github
  owner: impuLseUZ
  repo: netpulse.uz

win:
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

portable:
  artifactName: ${productName}-${version}-portable.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  artifactName: ${productName}-${version}-setup.${ext}

linux:
  target:
    - AppImage
    - deb
  category: Network
  artifactName: ${productName}-${version}.${ext}

mac:
  target:
    - dmg
  category: public.app-category.utilities
  artifactName: ${productName}-${version}.${ext}